name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never abort an in-flight deploy

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io push

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Sentry source-map upload — only fires when the token is set.
          secrets: |
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"

  release:
    name: Deploy to platform
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Replace the body of this step with whatever your hosting target needs.
      # Examples:
      #   - Railway: `railway up --service web --image ${{ needs.build-and-push.outputs.image }}`
      #   - Render:  trigger deploy hook via `curl -X POST $RENDER_DEPLOY_HOOK`
      #   - Fly.io:  `flyctl deploy --image ${{ needs.build-and-push.outputs.image }}`
      - name: Deploy (placeholder)
        run: |
          echo "Would deploy image: ${{ needs.build-and-push.outputs.image }}"
          echo "Wire your hosting platform's CLI / deploy hook here."
