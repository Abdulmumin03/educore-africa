name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + typecheck + unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: educore
          POSTGRES_PASSWORD: educore
          POSTGRES_DB: educore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educore -d educore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://educore:educore@localhost:5432/educore_ci
      DIRECT_URL: postgres://educore:educore@localhost:5432/educore_ci
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      # Vitest reads these as no-ops; tests stub when they need a value.
      PAYSTACK_SECRET_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter @educore/database exec prisma migrate deploy

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter web run test
